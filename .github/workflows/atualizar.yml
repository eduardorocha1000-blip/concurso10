name: Atualização diária
on:
  schedule:
    - cron: "0 6 * * *"   # 03:00 em Brasília
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/atualizar.py
      - name: Commit se houver mudança
        run: |
          git config user.name "atualizador"
          git config user.email "atualizador@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "Atualização diária da base" && git push)
